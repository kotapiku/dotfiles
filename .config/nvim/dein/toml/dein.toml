[[plugins]]
repo = 'Shougo/dein.vim'

# status bar
[[plugins]]
repo = 'vim-airline/vim-airline'
depends = ['vim-airline-themes']
hook_add = '''
  let g:airline_powerline_fonts = 0
  let g:airline_left_sep = ''
  let g:airline_right_sep = ''
  let g:airline_left_alt_sep = '│'
  let g:airline_right_alt_sep = '│'
  let g:airline_skip_empty_sections = 1
  let g:airline_stl_path_style = 'short'
  let g:airline_section_z = '%l:%c  %p%%'
  let g:airline#parts#ffenc#skip_expected_string = 'utf-8[unix]'
  let g:airline#extensions#tabline#enabled = 1
  let g:airline#extensions#tabline#formatter = 'unique_tail'
  let g:airline#extensions#tabline#show_tab_count = 0
  let g:airline#extensions#tabline#show_tab_type = 0
  let g:airline#extensions#tabline#show_close_button = 0
  let g:airline#extensions#tabline#left_sep = ''
  let g:airline#extensions#tabline#left_alt_sep = '│'
  set laststatus=2 noshowmode
'''

[[plugins]]
repo = 'vim-airline/vim-airline-themes'

[[plugins]]
repo = 'nordtheme/vim'
hook_add = '''
  let g:nord_uniform_status_lines = 0
  let g:airline_theme='nord'
'''

[[plugins]]
repo = 'airblade/vim-gitgutter'

[[plugins]]
repo = 'embear/vim-localvimrc'
hook_add = 'let g:localvimrc_ask = 0'

# comment
[[plugins]]
repo = 'tyru/caw.vim'
hook_add = '''
  nmap <Leader>c <Plug>(caw:hatpos:toggle)
  vmap <Leader>c <Plug>(caw:hatpos:toggle)
'''

# brackets
[[plugins]]
repo = 'itmammoth/doorboy.vim' # auto completion

[[plugins]]
repo = 'machakann/vim-sandwich' # saiw(, sdb, sd(, srb(, sr"(

[[plugins]]
repo = 'junegunn/fzf'
build = './install --all'

[[plugins]]
repo = 'junegunn/fzf.vim'
depends = ['fzf']
hook_add = '''
  let g:fzf_layout = { 'down': '~30%' }
  nnoremap <silent> ,f :Files<CR>
  nnoremap <silent> ,g :GFiles<CR>
  nnoremap <silent> ,F :GFiles?<CR>
  nnoremap <silent> ,b :Buffers<CR>
  nnoremap <silent> ,l :BLines<CR>
  nnoremap <silent> ,L :Lines<CR>
  nnoremap <silent> ,h :History<CR>
  nnoremap <silent> ,m :Mark<CR>

  nnoremap <silent> <C-]> :call fzf#vim#tags(expand('<cword>'))<CR>
  let g:fzf_buffers_jump = 1
'''

# LaTeX: load the global inverse-search command even without a TeX buffer.
[[plugins]]
repo = 'lervag/vimtex'
# Keep the installed version compatible with Neovim 0.11.3.
# Revisit this pin when upgrading Neovim; do not update VimTeX independently.
rev = '877de3ba5de5f766e5bfa1c3fb0d2ecfcd18f868'
hook_add = '''
  let g:tex_flavor = 'latex'
  let g:vimtex_quickfix_open_on_warning = 0
  let g:vimtex_view_method = 'skim'
  let g:vimtex_view_skim_sync = 1
  let g:vimtex_view_skim_activate = 1
  let g:vimtex_fold_enabled = 1
  let g:vimtex_fold_manual = 1
'''

# Explicit Tab expansion with a small set of LaTeX snippets.
[[plugins]]
repo = 'L3MON4D3/LuaSnip'
rev = 'v2.4.1'
